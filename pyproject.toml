[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "phonon-charge-pdf"
dynamic = ["version"]
description = "Neganov-Luke phonon / ionization-charge band PDF and event simulator for cryogenic detector NR/ER recoils, with an optional Fortran-accelerated backend."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
]

[project.optional-dependencies]
test = ["matplotlib", "equibin"]

# pymdown-extensions pinned below 12: mkdocstrings 1.0.6 (latest as of this
# writing) calls pymdownx.highlight.Highlight.__init__() without its `md`
# argument, which pymdown-extensions made required starting in some 12.x
# release -- "TypeError: Highlight.__init__() missing 1 required positional
# argument: 'md'" building any mkdocstrings page. 11.0.2 is confirmed
# working; revisit this pin once mkdocstrings ships a fix.

# black: mkdocstrings' separate_signature option (see mkdocs.yml) formats
# each rendered signature with Black if it's installed, falling back to an
# unformatted one-liner otherwise -- installed here so signatures in the
# published API reference are always nicely wrapped one-argument-per-line.
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]", "pymdown-extensions<12", "black"]

[project.urls]
Repository = "https://github.com/det-lab/phonon-charge-pdf"
Documentation = "https://det-lab.github.io/phonon-charge-pdf/"

[tool.setuptools]
package-dir = {"phonon_charge_pdf" = "python"}
packages = ["phonon_charge_pdf", "phonon_charge_pdf.internal", "phonon_charge_pdf.cli"]

[tool.setuptools.package-data]
"phonon_charge_pdf.cli" = ["table_registry.json"]

[tool.setuptools_scm]
