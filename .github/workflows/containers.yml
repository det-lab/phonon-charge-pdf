name: Build and publish containers

# Builds the two published images (LLVM-based: the HPC/library container
# and the Jupyter container) and pushes them to GHCR tagged with the
# release version, plus `latest`.
#
# `ref` decouples "which ref this workflow definition runs from" (the
# branch/tag you dispatch against, or whatever tag triggered the push
# event) from "which ref's source gets built": on a tag push these are
# the same, but a manual dispatch can target an older tag to backfill an
# image for a release cut before this workflow existed, even though that
# tag's commit has no containers.yml of its own -- the workflow file is
# read from the ref you dispatch from (e.g. main/develop), while the
# `ref` input picks what actually gets checked out and built.
#
# Only push `latest` when building the newest release: re-running this
# for an older tag after a newer one has already published would
# otherwise move `latest` backwards.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag to build containers from (e.g. v2.0.2)'
        required: true
      update_latest:
        description: 'Also tag these images latest'
        type: boolean
        default: true

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: phonon-charge-pdf-llvm
            dockerfile: Dockerfile_llvm
          - image: phonon-charge-pdf-jupyter
            dockerfile: Dockerfile_jupyter
    steps:
      - name: Resolve build ref and image tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.ref }}"
            UPDATE_LATEST="${{ inputs.update_latest }}"
          else
            REF="${{ github.ref_name }}"
            UPDATE_LATEST="true"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

          TAGS="ghcr.io/det-lab/${{ matrix.image }}:$REF"
          if [ "$UPDATE_LATEST" = "true" ]; then
            TAGS="$(printf '%s\n%s' "$TAGS" "ghcr.io/det-lab/${{ matrix.image }}:latest")"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/det-lab/phonon-charge-pdf
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.ref }}

  bump-pull-default:
    name: Bump pull_container.job's default tag
    needs: publish
    # Only a real tag push, never workflow_dispatch: that path explicitly
    # backfills images for *old* historical releases (see the comment on
    # `on:` above), and must not move this default forward.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Bump the default IMAGE tag
        id: bump
        run: |
          NEW_TAG="${{ github.ref_name }}"
          OLD="$(grep -o 'phonon-charge-pdf-llvm:v[0-9][0-9A-Za-z.+-]*' slurm/pull_container.job)"
          sed -i "s|$OLD|phonon-charge-pdf-llvm:$NEW_TAG|" slurm/pull_container.job
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Open a PR into develop
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/bump-pull-container-${{ steps.bump.outputs.new_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "slurm: bump pull_container.job's default image to ${{ steps.bump.outputs.new_tag }}"
          git push origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$BRANCH" \
            --title "Bump pull_container.job's default image to ${{ steps.bump.outputs.new_tag }}" \
            --body "Auto-opened after publishing ${{ steps.bump.outputs.new_tag }} to GHCR. The smoke test itself is already name-agnostic (container_smoke_test.py) -- this one-line default-tag bump is the only thing a release still needs here."
