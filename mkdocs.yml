site_name: phonon-charge-pdf
site_description: Neganov-Luke phonon / ionization-charge band PDF and event simulator for cryogenic detector NR/ER recoils
site_url: https://det-lab.github.io/phonon-charge-pdf/
repo_url: https://github.com/det-lab/phonon-charge-pdf
repo_name: det-lab/phonon-charge-pdf
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Two ways to use this: two-ways.md
  - Generating simulated events: python-events.md
  - Fitting: fitting.md
  - Using MCMC to get errors: mcmc.md
  - Testing goodness of fit: goodness-of-fit.md
  - Computing new normalization tables: normalization-tables.md
  - Python API reference: api/index.md
  - Fortran API reference: https://det-lab.github.io/phonon-charge-pdf/fortran-api/
  - For the cautious:
      - Verification and validation: testing.md
      - Inspecting the integrand: inspecting-the-integrand.md
  - For developers:
      - Building from source: building-from-source.md
      - Profiling: PROFILING.md
  - To delete:
      - Fortran-backed PDF (Ppq_compiled): ppq-fort.md
      - Resolution/yield model: ppq-py.md
      - Miscellaneous notes: misc-notes.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            docstring_style: numpy
            docstring_section_style: list
            merge_init_into_class: true
            separate_signature: true
            line_length: 60
